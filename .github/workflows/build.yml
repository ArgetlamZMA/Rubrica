name: Compilar, probar y publicar

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Firma de código con SignPath Foundation: solo en versiones (etiquetas v*) y cuando el proyecto
      # ya está aprobado y configurado (secreto SIGNPATH_API_TOKEN y variables SIGNPATH_*). Ver docs/firma-de-codigo.md.
      SIGNPATH: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Versión
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content web/package.json | ConvertFrom-Json
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = $pkg.version }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      # ---------- Interfaz web ----------
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar interfaz (web/dist)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pruebas de la interfaz (Playwright)
        working-directory: web
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install chromium
          python tests/run_all.py

      # ---------- Aplicación de Windows ----------
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Pruebas C#
        run: dotnet test native/Rubrica.Tests/Rubrica.Tests.csproj -c Release
      - name: Publicar Rubrica.exe
        run: |
          dotnet publish native/Rubrica/Rubrica.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish
          dotnet publish native/Rubrica/Rubrica.csproj -c Release -r win-arm64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish-arm64

      - name: Subir Rubrica.exe para firmar (SignPath)
        if: env.SIGNPATH == 'true'
        id: up-exe
        uses: actions/upload-artifact@v5
        with:
          name: rubrica-exe-sin-firma
          path: |
            publish/Rubrica.exe
            publish-arm64/Rubrica.exe

      - name: Firmar Rubrica.exe (SignPath, requiere aprobación manual)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: rubrica-exe
          github-artifact-id: ${{ steps.up-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: firmado-exe

      - name: Usar Rubrica.exe firmado
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          foreach ($d in 'publish', 'publish-arm64') {
            Copy-Item "firmado-exe/$d/Rubrica.exe" "$d/Rubrica.exe" -Force
            $s = Get-AuthenticodeSignature "$d/Rubrica.exe"
            Write-Output "$d/Rubrica.exe: $($s.Status) · $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { Write-Output "::error::$d/Rubrica.exe no quedó firmado"; exit 1 }
          }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} /DPublishDir=..\publish installer\Rubrica.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} /DPublishDir=..\publish-arm64 /DArch=arm64 installer\Rubrica.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path web/dist/* -DestinationPath dist-installer/Rubrica-Web-${{ steps.ver.outputs.version }}.zip -Force

      - name: Subir instalador para firmar (SignPath)
        if: env.SIGNPATH == 'true'
        id: up-setup
        uses: actions/upload-artifact@v5
        with:
          name: rubrica-setup-sin-firma
          path: dist-installer/Rubrica-Setup-*.exe

      - name: Firmar instalador (SignPath, requiere aprobación manual)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: rubrica-setup
          github-artifact-id: ${{ steps.up-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: firmado-setup

      - name: Usar instalador firmado
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem firmado-setup -Filter 'Rubrica-Setup-*.exe') {
            Copy-Item $f.FullName "dist-installer/$($f.Name)" -Force
            $s = Get-AuthenticodeSignature "dist-installer/$($f.Name)"
            Write-Output "$($f.Name): $($s.Status) · $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { Write-Output "::error::$($f.Name) no quedó firmado"; exit 1 }
          }

      - name: Manifiesto SHA-256 firmado (actualizaciones verificadas)
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $files = Get-ChildItem dist-installer -File | Where-Object { $_.Name -notlike 'SHA256SUMS*' } | Sort-Object Name
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $text = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText("dist-installer/SHA256SUMS.txt", $text, [Text.UTF8Encoding]::new($false))
          Get-Content dist-installer/SHA256SUMS.txt
          if (-not $env:UPDATE_SIGNING_KEY) {
            Write-Output "::warning::Falta el secreto UPDATE_SIGNING_KEY: el manifiesto no se firma y la app no instalará esta versión automáticamente."
          } else {
            # Se toma solo el bloque PRIVATE KEY (tolera texto alrededor, la clave pública incluida o saltos de línea perdidos)
            $m = [regex]::Match($env:UPDATE_SIGNING_KEY, '-----BEGIN PRIVATE KEY-----(?<k>[\s\S]+?)-----END PRIVATE KEY-----')
            if (-not $m.Success) { Write-Output "::error::UPDATE_SIGNING_KEY no contiene un bloque '-----BEGIN PRIVATE KEY----- ... -----END PRIVATE KEY-----'"; exit 1 }
            $ec = [Security.Cryptography.ECDsa]::Create()
            $read = 0
            $ec.ImportPkcs8PrivateKey([Convert]::FromBase64String(($m.Groups['k'].Value -replace '\s', '')), [ref]$read)
            $data = [IO.File]::ReadAllBytes("dist-installer/SHA256SUMS.txt")
            $sig = $ec.SignData($data, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence)
            [IO.File]::WriteAllBytes("dist-installer/SHA256SUMS.txt.sig", $sig)
            $pub = (Select-String -Path native/Rubrica/AppInfo.cs -Pattern '^[A-Za-z0-9+/=]{20,}$' | ForEach-Object { $_.Line }) -join ''
            $check = [Security.Cryptography.ECDsa]::Create()
            $check.ImportSubjectPublicKeyInfo([Convert]::FromBase64String($pub), [ref]0)
            if (-not $check.VerifyData($data, $sig, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence)) {
              Write-Output "::error::UPDATE_SIGNING_KEY no corresponde a la clave pública de AppInfo.cs"; exit 1
            }
            Write-Output "Manifiesto firmado y verificado con la clave pública de la app."
          }

      - uses: actions/upload-artifact@v5
        with:
          name: Rubrica-${{ steps.ver.outputs.version }}
          path: dist-installer/*

      - name: Publicar versión (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*
          generate_release_notes: true

  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Versión
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p "require('./web/package.json').version")"; fi
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${MA:-1} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json

      - name: Compilar interfaz y sincronizar con Android
        run: |
          set -o pipefail
          ( (cd web && npm ci && npm run build && rm -rf dist/ocr) && (cd mobile && npm ci && npx cap sync android) ) 2>&1 | tee "$RUNNER_TEMP/sync.log" || {
            tail -25 "$RUNNER_TEMP/sync.log" | while IFS= read -r l; do echo "::error::${l//%/%25}"; done; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Almacén de claves (secretos del repositorio)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Faltan los secretos ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD: se genera un APK de prueba firmado con clave temporal."
          fi

      - name: Compilar APK
        working-directory: mobile/android
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ github.ref_type == 'tag' && steps.ver.outputs.code || github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: rubrica
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          TASK=assembleRelease; [ -z "$ANDROID_KEYSTORE_FILE" ] && TASK=assembleDebug
          set -o pipefail
          ./gradlew --no-daemon --stacktrace "$TASK" 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            grep -E "error:|ERROR|FAILURE|What went wrong|\.java:[0-9]+|Could not|> " "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1; }
          mkdir -p ../../dist-android
          APK=$(ls app/build/outputs/apk/*/*.apk | head -1)
          SUFFIX=""; [ -z "$ANDROID_KEYSTORE_FILE" ] && SUFFIX="-prueba"
          cp "$APK" "../../dist-android/Rubrica-Android-${VERSION_NAME}${SUFFIX}.apk"
          ls -la ../../dist-android

      - uses: actions/upload-artifact@v5
        with:
          name: Rubrica-Android-${{ steps.ver.outputs.version }}
          path: dist-android/*.apk

      - name: Publicar APK en la versión (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.file != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*.apk
