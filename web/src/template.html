<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rúbrica</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand"><span class="brand-mark" id="brand-mark"></span><span class="brand-name">Rúbrica<small>ZMA INVERSIONES</small></span></div>
    <div id="doctabs"></div>
    <div class="title-actions">
      <span id="cloud-status" class="cloud-status"></span>
      <button class="icon-btn" id="btn-theme" title="Tema claro / oscuro"></button>
      <button class="icon-btn" id="btn-settings" title="Configuración"></button>
    </div>
  </header>
  <nav id="ribbon-tabs"></nav>
  <div id="ribbon"></div>
  <main id="main">
    <aside id="sidebar">
      <div id="side-icons"></div>
      <div id="side-panel"><div id="side-head"></div><div id="side-body"></div></div>
    </aside>
    <section id="viewer-wrap">
      <div id="home"></div>
      <div id="viewer" tabindex="0"><div id="pages"></div></div>
      <div id="organizer"></div>
    </section>
    <aside id="props"><div id="props-body"></div></aside>
  </main>
  <footer id="statusbar">
    <div class="sb-left"><button class="btn sm" id="sb-style" style="display:none">Estilo</button><span id="sb-msg"></span></div>
    <div class="sb-center">
      <button class="icon-btn sm" id="sb-prev" title="Página anterior"></button>
      <input id="sb-page" type="text" value="0"> <span id="sb-total">/ 0</span>
      <button class="icon-btn sm" id="sb-next" title="Página siguiente"></button>
    </div>
    <div class="sb-right">
      <button class="icon-btn sm" id="sb-fitw" title="Ajustar al ancho"></button>
      <button class="icon-btn sm" id="sb-fitp" title="Página completa"></button>
      <button class="icon-btn sm" id="sb-zout" title="Alejar"></button>
      <select id="sb-zoom"></select>
      <button class="icon-btn sm" id="sb-zin" title="Acercar"></button>
    </div>
  </footer>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="busy"><div class="busy-box"><div class="spinner"></div><div id="busy-msg">Procesando…</div><div class="busy-bar"><div id="busy-fill"></div></div></div></div>
<input type="file" id="file-input" hidden>
<script type="text/plain" id="pdfjs-worker-src">/*__PDFJS_WORKER__*/</script>
<script>/*__PDFJS__*/</script>

</body>
</html>
